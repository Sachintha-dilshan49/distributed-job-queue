name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobqueue_test
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobqueue -d jobqueue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/jobqueue_test
      TEST_DB_USER: jobqueue
      TEST_DB_PASSWORD: jobqueue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode clean verify

      - name: Show test failures
        if: failure()
        run: cat target/surefire-reports/*.txt